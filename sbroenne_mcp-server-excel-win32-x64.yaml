name: Mcp Server Excel Win32 X64
shortDescription: Windows x64 runtime for @sbroenne/mcp-server-excel, the Microsoft
  Excel automation MCP server. Requires desktop Excel.
description: 'Windows x64 runtime for @sbroenne/mcp-server-excel, the Microsoft Excel
  automation MCP server. Requires desktop Excel.


  Джерело: git+https://github.com/sbroenne/mcp-server-excel.git'
metadata:
  categories: Tools
  icon: ''
  repoURL: git+https://github.com/sbroenne/mcp-server-excel.git
runtime: containerized
containerizedConfig:
  image: ghcr.io/obot-platform/mcp-images/stdio-wrapper:latest
  port: 8099
  path: /
  args:
  - npx
  - -y
  - '@sbroenne/mcp-server-excel-win32-x64'
