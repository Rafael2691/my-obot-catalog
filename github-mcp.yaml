name: GitHub MCP
shortDescription: Управління репозиторіями та кодом GitHub
description: Управління репозиторіями та кодом GitHub
metadata:
  categories: Developer Tools
  icon: ''
  repoURL: https://github.com/topics/mcp-server
runtime: containerized
containerizedConfig:
  image: ghcr.io/obot-platform/mcp-images/stdio-wrapper:latest
  port: 8099
  path: /
  args:
  - npx
  - -y
  - '@modelcontextprotocol/server-github'
config:
- key: GITHUB_PERSONAL_ACCESS_TOKEN
  name: GitHub Personal Access Token
  required: true
  sensitive: true
  usage: env
  description: Персональний токен GitHub
