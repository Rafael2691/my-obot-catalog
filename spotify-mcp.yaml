name: Spotify MCP
shortDescription: Управління відтворенням, треками та плейлистами Spotify
description: Інтеграція зі Spotify API через OAuth Refresh Token.
metadata:
  categories: Media & Audio
  icon: https://open.spotifycdn.com/cdn/images/favicon.54780344.ico
  repoURL: https://github.com/topics/spotify-mcp
runtime: containerized
containerizedConfig:
  image: ghcr.io/obot-platform/mcp-images/stdio-wrapper:latest
  port: 8099
  path: /
  args:
    - npx
    - -y
    - "@spotify/mcp"
config:
  - key: SPOTIFY_CLIENT_ID
    name: Spotify Client ID
    required: true
    sensitive: true
    description: Введіть Client ID (ad17ac24a6e5469a8705f3fac7d3837b)
  - key: SPOTIFY_CLIENT_SECRET
    name: Spotify Client Secret
    required: true
    sensitive: true
    description: Введіть Client Secret (59616ed043da4b6ba652a9e2f686088a)
  - key: SPOTIFY_REFRESH_TOKEN
    name: Spotify Refresh Token
    required: true
    sensitive: true
    description: Введіть отриманий Refresh Token
