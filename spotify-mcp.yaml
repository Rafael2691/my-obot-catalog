name: Spotify MCP
shortDescription: Управління відтворенням, треками та плейлистами Spotify
description: Управління відтворенням, треками та плейлистами Spotify
metadata:
  categories: Media & Audio
  icon: ''
  repoURL: https://github.com/topics/mcp-server
runtime: containerized
containerizedConfig:
  image: ghcr.io/obot-platform/mcp-images/stdio-wrapper:latest
  port: 8099
  path: /
  args:
  - npx
  - -y
  - '@spotify/mcp'
config:
- key: SPOTIFY_CLIENT_ID
  name: Spotify Client ID
  required: true
  sensitive: true
  usage: env
  description: Client ID з Spotify Developer Dashboard
- key: SPOTIFY_CLIENT_SECRET
  name: Spotify Client Secret
  required: true
  sensitive: true
  usage: env
  description: Client Secret з Spotify Developer Dashboard
- key: SPOTIFY_REFRESH_TOKEN
  name: Spotify Refresh Token
  required: true
  sensitive: true
  usage: env
  description: Отриманий OAuth Refresh Token
